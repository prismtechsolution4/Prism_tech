<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <!-- Background glow filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7ed33f" flood-opacity="0.25" />
    </filter>

    <!-- Gradients for 3D Prism facets -->
    <!-- Brand Primary Green: #7ed33f, Cyber Cyan: #22e5ff -->
    <linearGradient id="p-stem-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9bf560" />
      <stop offset="60%" stop-color="#7ed33f" />
      <stop offset="100%" stop-color="#3c8a14" />
    </linearGradient>

    <linearGradient id="p-stem-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b4520" />
      <stop offset="100%" stop-color="#0a1c0d" />
    </linearGradient>

    <linearGradient id="p-stem-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b6ff85" />
      <stop offset="100%" stop-color="#d9ffba" />
    </linearGradient>

    <linearGradient id="p-loop-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ed33f" />
      <stop offset="50%" stop-color="#3fe2d3" />
      <stop offset="100%" stop-color="#22e5ff" />
    </linearGradient>

    <linearGradient id="p-loop-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146654" />
      <stop offset="100%" stop-color="#06222c" />
    </linearGradient>

    <linearGradient id="t-bar-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#35f0ff" />
      <stop offset="60%" stop-color="#22e5ff" />
      <stop offset="100%" stop-color="#7ed33f" />
    </linearGradient>

    <linearGradient id="t-bar-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1bc2db" />
      <stop offset="100%" stop-color="#0b5f6e" />
    </linearGradient>

    <linearGradient id="t-stem-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22e5ff" />
      <stop offset="60%" stop-color="#139db0" />
      <stop offset="100%" stop-color="#07444d" />
    </linearGradient>

    <linearGradient id="t-stem-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b3038" />
      <stop offset="100%" stop-color="#041217" />
    </linearGradient>

    <linearGradient id="prism-glass-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#22e5ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7ed33f" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ed33f" />
      <stop offset="100%" stop-color="#22e5ff" />
    </linearGradient>
  </defs>

  <!-- 3D PT PRISM EMBLEM (x: 20 to 240, y: 20 to 260) -->
  <g transform="translate(30, 20)" filter="url(#soft-shadow)">
    <!-- Ambient ambient back glow behind prism -->
    <circle cx="110" cy="120" r="75" fill="#7ed33f" opacity="0.12" filter="url(#neon-glow)" />
    <circle cx="160" cy="90" r="65" fill="#22e5ff" opacity="0.15" filter="url(#neon-glow)" />

    <!-- 3D 'P' STRUCTURE -->
    <!-- 'P' Pillar: Isometric Left Stem -->
    <!-- Front facet of P vertical column -->
    <polygon points="50,75 78,60 78,205 50,220" fill="url(#p-stem-front)" />
    <!-- Side facet of P vertical column (dark depth) -->
    <polygon points="26,88 50,75 50,220 26,206" fill="url(#p-stem-side)" />
    <!-- Top diamond cap of P vertical column -->
    <polygon points="50,75 78,60 54,48 26,62" fill="url(#p-stem-top)" />

    <!-- 'P' Upper Loop (Isometric crystal loop connecting to P stem) -->
    <!-- Top facet of P loop upper arc -->
    <polygon points="78,60 148,22 174,36 104,74" fill="url(#p-loop-top)" />
    <!-- Outer front facet of P loop curving down -->
    <polygon points="148,22 174,36 174,124 148,110" fill="url(#t-bar-top)" />
    <!-- Bottom return facet of P loop returning to stem -->
    <polygon points="78,146 148,110 174,124 104,162" fill="url(#p-stem-front)" />
    <!-- Side inner facet of P loop hole (depth) -->
    <polygon points="78,92 120,68 120,102 78,124" fill="url(#p-loop-side)" />

    <!-- 3D 'T' STRUCTURE (Interlocking with the P through isometric depth) -->
    <!-- 'T' Horizontal Crossbar (Sits prominently across upper right) -->
    <!-- Top facet of T crossbar -->
    <polygon points="120,50 220,0 248,15 148,65" fill="url(#t-bar-top)" />
    <!-- Front facet of T crossbar (glowing electric cyan) -->
    <polygon points="148,65 248,15 248,38 148,88" fill="url(#t-bar-front)" />
    <!-- Left end facet of T crossbar -->
    <polygon points="120,50 148,65 148,88 120,72" fill="url(#t-stem-side)" />
    <!-- Right end facet of T crossbar -->
    <polygon points="220,0 248,15 248,38 220,22" fill="url(#p-stem-top)" />

    <!-- 'T' Vertical Central Stem (Dropping down from crossbar) -->
    <!-- Front facet of T vertical stem -->
    <polygon points="174,75 200,62 200,210 174,224" fill="url(#t-stem-front)" />
    <!-- Side facet of T vertical stem (shadow/contrast facet) -->
    <polygon points="200,62 218,72 218,198 200,210" fill="url(#t-stem-side)" />
    <!-- Bottom end facet of T stem -->
    <polygon points="174,224 200,210 218,198 192,212" fill="url(#p-stem-side)" />

    <!-- PRISMATIC REFRACTIVE LIGHT ACCENTS & BEVELS -->
    <!-- Sharp light specular highlight on the central apex intersection -->
    <polygon points="78,60 104,74 78,88 50,75" fill="url(#prism-glass-glow)" opacity="0.85" />
    <polygon points="148,22 174,36 148,50 120,38" fill="#ffffff" opacity="0.65" />

    <!-- Crisp neon laser edge strokes -->
    <polyline points="26,62 50,75 78,60 148,22 220,0 248,15" fill="none" stroke="#b6ff85" stroke-width="2.2" stroke-linecap="round" />
    <polyline points="78,60 78,205 50,220 26,206" fill="none" stroke="#7ed33f" stroke-width="1.5" opacity="0.7" />
    <polyline points="148,65 248,15 248,38" fill="none" stroke="#22e5ff" stroke-width="2" stroke-linecap="round" />
    <polyline points="174,75 174,224 200,210 218,198" fill="none" stroke="#22e5ff" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Central Prism Core Specular Sparkle -->
    <circle cx="148" cy="22" r="3.5" fill="#ffffff" />
    <circle cx="148" cy="22" r="8" fill="#22e5ff" opacity="0.6" filter="url(#neon-glow)" />
    <circle cx="78" cy="60" r="3" fill="#ffffff" />
    <circle cx="78" cy="60" r="7" fill="#7ed33f" opacity="0.6" filter="url(#neon-glow)" />
  </g>

  <!-- TYPOGRAPHY: "PrismTech SOLUTIONS" -->
  <g transform="translate(330, 40)">
    <!-- "Prism" in Ultra-Clean Space Grotesk Bold White -->
    <text x="0" y="112" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="106" font-weight="700" fill="#ffffff" letter-spacing="-0.02em">
      Prism<tspan fill="url(#text-grad)">Tech</tspan>
    </text>

    <!-- Subtitle: "S O L U T I O N S" with modern wide tracking -->
    <text x="6" y="176" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#8ba19a" letter-spacing="0.48em">
      SOLUTIONS
    </text>

    <!-- Subtle futuristic accent underline tick -->
    <rect x="6" y="196" width="60" height="3" rx="1.5" fill="#7ed33f" />
    <rect x="74" y="196" width="18" height="3" rx="1.5" fill="#22e5ff" />
  </g>
</svg>