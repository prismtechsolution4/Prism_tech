<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="540" height="110">
  <defs>
    <linearGradient id="intGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="60%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="intGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="intGradC" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>
    <linearGradient id="intGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="intechTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="tiveTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="intechNeon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(18, 10)">
    <circle cx="44" cy="45" r="42" fill="url(#intGlow)" opacity="0.32" filter="url(#intechNeon)" />
    <polygon points="44,5 82,27 82,71 44,93 6,71 6,27" fill="none" stroke="rgba(0, 245, 255, 0.28)" stroke-width="1.5" stroke-dasharray="3 3" />
    <polygon points="44,12 76,30 44,48 12,30" fill="url(#intGradA)" opacity="0.95" />
    <polygon points="12,30 44,48 44,84 12,66" fill="url(#intGradB)" opacity="0.92" />
    <polygon points="44,48 76,30 76,66 44,84" fill="url(#intGradC)" opacity="0.96" />
    <line x1="44" y1="12" x2="44" y2="48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="30" x2="44" y2="48" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" />
    <line x1="76" y1="30" x2="44" y2="48" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" />
    <circle cx="44" cy="12" r="3.5" fill="#FFFFFF" filter="url(#intechNeon)" />
    <circle cx="12" cy="30" r="3" fill="#00F5FF" />
    <circle cx="76" cy="30" r="3" fill="#818CF8" />
    <circle cx="44" cy="48" r="4" fill="#FFFFFF" filter="url(#intechNeon)" />
    <circle cx="44" cy="84" r="3" fill="#00F5FF" />
    <circle cx="85" cy="18" r="2.5" fill="#00F5FF" filter="url(#intechNeon)" />
    <line x1="44" y1="12" x2="85" y2="18" stroke="rgba(0, 245, 255, 0.45)" stroke-dasharray="2 3" stroke-width="1" />
  </g>

  <g transform="translate(122, 0)">
    <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="42" letter-spacing="2.5" fill="url(#intechTextGrad)">INTECH</text>
    <text x="180" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="42" letter-spacing="2.5" fill="url(#tiveTextGrad)" filter="url(#intechNeon)">TIVE</text>
    <g transform="translate(2, 85)">
      <line x1="0" y1="-7" x2="32" y2="-7" stroke="#00F5FF" stroke-width="2" />
      <circle cx="32" cy="-7" r="2" fill="#00F5FF" />
      <text x="44" y="-2" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="13.5" letter-spacing="8" fill="#E2E8F0">SOLUTIONS</text>
      <line x1="262" y1="-7" x2="294" y2="-7" stroke="#818CF8" stroke-width="2" />
      <circle cx="262" cy="-7" r="2" fill="#818CF8" />
    </g>
  </g>
</svg>