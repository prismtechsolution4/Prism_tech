<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="prism-icon-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4eebb1" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <g id="emblem-center" transform="translate(2, 10)">
    <!-- White facets: Top-Right -> Top -> Top-Left -> Left -> Bottom-Left -> Bottom -->
    <path 
      d="M 125 43 L 78 16 L 31 43 L 31 97 L 78 124" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="10" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Electric Emerald/Mint facets: Top-Right -> Right -> Bottom-Right -> Bottom -->
    <path 
      d="M 125 43 L 125 97 L 78 124" 
      fill="none" 
      stroke="url(#prism-icon-green)" 
      stroke-width="10" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Letter P centered -->
    <path 
      d="M 64 47 L 80 47 C 88 47 93.5 51.5 93.5 59.5 C 93.5 67.5 88 72 80 72 L 72.5 72 L 72.5 95 L 64 95 Z M 72.5 55 L 72.5 64 L 79.5 64 C 83.2 64 85.5 62.2 85.5 59.5 C 85.5 56.8 83.2 55 79.5 55 Z" 
      fill="#ffffff" 
    />
  </g>
</svg>